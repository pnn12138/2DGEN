# Hydra entrypoint for the Jdft2d regression task.
defaults:
  - data: matbench_jdft2d
  - model: alignn
  - trainer: finetune
  - loss: exfoliation_reg
  - logging: tensorboard
  - callbacks: early_stop
  - _self_

task:
  name: jdft2d
  target: exfoliation_energy_ev_per_area
  seed: 42
  fold: 0
  notes: ''

hydra:
  run:
    dir: ${logging.logging.out_dir}/${task.name}/${now:%Y%m%d_%H%M%S}
  sweep:
    dir: ${logging.logging.out_dir}/${task.name}/multirun
    subdir: ${hydra.job.num}_${now:%H%M%S}
