# Data configuration for CGCNN Jdft2d exfoliation-energy regression.
dataset:
  name: JARVIS_Jdft2d
  format: jarvis_dft
  root: ${oc.env:JDFT2D_ROOT,"/home/pnn/2dgen/P_TASK/data/JARVIS/jdft2d_exfoliation/ache"}
  split_file: splits/jdft2d_seed${task.seed}.json
  target_key: ${task.target}
  id_key: material_id
  extras:
    property_key: exfoliation_energy
    units: eV/atom

preprocess:
  normalize_targets: true
  target_stats:
    mean: 0.0
    std: 1.0
  graph_builder:
    type: radius_graph
    cutoff: 8.0
    max_neighbors: 12
    self_loop: false
    allow_pbc: true
  atom_embedding:
    scheme: cgcnn
    max_atom_num: 92

loader:
  train:
    batch_size: 128
    shuffle: true
    num_workers: 8
    pin_memory: true
    drop_last: true
  val:
    batch_size: 256
    shuffle: false
    num_workers: 8
    pin_memory: true
    drop_last: false
  test:
    batch_size: 256
    shuffle: false
    num_workers: 8
    pin_memory: true
    drop_last: false

transforms:
  - type: standardize_lattice
  - type: random_rotation
  - type: encode_cgcnn_features
