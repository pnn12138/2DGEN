# Data config for matbench_jdft2d ALIGNN baseline.
dataset:
  name: matbench_jdft2d
  root: ${oc.env:JDFT2D_CACHE,"/home/pnn/2dgen/P_TASK/data/jdft2d_cache"}
  splits_file: ${oc.env:JDFT2D_SPLITS,"/home/pnn/2dgen/P_TASK/data/matbench_jdft2d_splits.json"}
  fold: ${task.fold}
  seed: ${task.seed}
  val_fraction: 0.0
  force_download: false

graph:
  cutoff: 8.0
  max_neighbors: 24
  num_rbf: 32
  num_abf: 8

loader:
  train:
    batch_size: 16
    num_workers: 4
  val:
    batch_size: 32
    num_workers: 4
  test:
    batch_size: 32
    num_workers: 4
