# Objectives and metrics for Jdft2d exfoliation-energy regression.
loss:
  name: l1
  reduction: mean
  weight: 1.0

target_processing:
  denormalize_predictions: true
  clamp_output: false

metrics:
  mae:
    name: mean_absolute_error
    lower_is_better: true
  rmse:
    name: root_mean_squared_error
    lower_is_better: true
  r2:
    name: r2_score
    lower_is_better: false
