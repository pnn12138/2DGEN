# Trainer/runtime defaults for CGCNN experiments.
trainer:
  max_epochs: 200
  accelerator: gpu
  devices: 1
  precision: 32
  accumulate_grad_batches: 1
  gradient_clip_val: 0.0
  log_every_n_steps: 50
  val_check_interval: 1.0
  deterministic: false
  benchmark: true

dataflow:
  train_loader: ${data.loader.train}
  val_loader: ${data.loader.val}
  test_loader: ${data.loader.test}

optimizer: ${model.optimizer}
lr_scheduler: null
